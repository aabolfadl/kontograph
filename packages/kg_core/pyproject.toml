[project]
name = "kg-core"
version = "0.1.0"
description = "Contracts, config, identifiers and time primitives"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastavro>=1.9",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_core"]
