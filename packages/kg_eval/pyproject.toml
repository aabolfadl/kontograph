[project]
name = "kg-eval"
version = "0.1.0"
description = "Chronological evaluation protocol, cost model, ablations, bootstrap CIs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_eval"]
