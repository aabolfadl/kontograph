[project]
name = "kg-sim"
version = "0.1.0"
description = "Agent-based synthetic German retail payments ecosystem"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_sim"]
