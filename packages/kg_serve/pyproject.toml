[project]
name = "kg-serve"
version = "0.1.0"
description = "FastAPI decision gateway under a 200 ms SLA"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "kg-features",
    "kg-models",
    "kg-sim",
    "kg-stream",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "onnxruntime>=1.18",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_serve"]
