[project]
name = "kg-cli"
version = "0.1.0"
description = "The kg command line — one entrypoint for every make target"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "kg-sim",
    "kg-lake",
    "kg-stream",
    "typer>=0.12",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_cli"]

[project.scripts]
kg = "kg_cli.main:main"
