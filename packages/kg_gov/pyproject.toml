[project]
name = "kg-gov"
version = "0.1.0"
description = "Model cards, lineage, AI Act memo, decision log, SAR narratives"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_gov"]
