# Optional Flink profile — see ADR-0002.
#
#   make flink-up      (or: docker compose -f docker/compose.yml \
#                            -f docker/compose.flink.yml --profile flink up -d)
#
# This is the specified streaming engine, and the feature DSL genuinely
# compiles to Flink SQL that runs here. It is NOT in the default stack because a
# JobManager + TaskManager costs ~2 GB of RAM and a minute of startup on a
# laptop, which would make `make up` too slow for the ten-second demo in design principle P10.
#
# The equivalence between this backend and the DuckDB/online backends is checked
# by the point-in-time property suite, which runs the Flink leg in CI.

name: kontograph

x-flink-common: &flink-common
  build:
    context: .
    dockerfile: Dockerfile.flink
  image: kontograph/flink:1.20
  profiles: ["flink"]
  environment:
    # Kafka is reachable on the internal listener; the host-facing 19092 is for
    # local Python clients only.
    KG_KAFKA_BOOTSTRAP: redpanda:9092
    KG_SCHEMA_REGISTRY_URL: http://redpanda:8081
    KG_S3_ENDPOINT: http://objectstore:9000
    AWS_ACCESS_KEY_ID: kontograph
    AWS_SECRET_ACCESS_KEY: kontograph
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 2
      parallelism.default: 2
      state.backend: rocksdb
      state.backend.incremental: true
      execution.checkpointing.interval: 30s
      execution.checkpointing.mode: EXACTLY_ONCE
      # Event time only. Processing time would silently make every window
      # non-deterministic on replay, which is the leakage failure mode in design principle P2.
      table.exec.source.idle-timeout: 10s
  depends_on:
    redpanda:
      condition: service_healthy
    objectstore:
      condition: service_healthy

services:
  flink-jobmanager:
    <<: *flink-common
    container_name: kontograph-flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"   # Flink web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  flink-taskmanager:
    <<: *flink-common
    container_name: kontograph-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g

  # SQL Gateway lets `kg features submit-flink` push generated SQL over HTTP
  # instead of shelling into a container — which keeps the submission path the
  # same in CI and locally.
  flink-sql-gateway:
    <<: *flink-common
    container_name: kontograph-flink-sql-gateway
    command: >
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    ports:
      - "8083:8083"
