[project]
name = "kg-models"
version = "0.1.0"
description = "LightGBM baseline, temporal GNN, amortised explainer, counterfactuals"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "kg-features",
    "kg-eval",
    "kg-sim",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_models"]
