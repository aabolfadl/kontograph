[project]
name = "kg-stream"
version = "0.1.0"
description = "Kafka ingest: Confluent wire format, Schema Registry, replay"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "confluent-kafka>=2.5",
    "httpx>=0.27",
    "fastavro>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_stream"]
