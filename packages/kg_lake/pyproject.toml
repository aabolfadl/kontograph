[project]
name = "kg-lake"
version = "0.1.0"
description = "Iceberg lakehouse: bronze/silver/gold and data-quality gates"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pyiceberg[s3fs,sql-sqlite]>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_lake"]
