[project]
name = "kg-features"
version = "0.1.0"
description = "Feature DSL compiled to DuckDB, Flink SQL and an online executor"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kg-core",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_features"]
